# Support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery monitoring. The halves need this to measure, the dongle needs it to
# enable CONFIG_ZMK_BATTERY_REPORTING_USB
CONFIG_ZMK_BATTERY_REPORTING=y

# Battery management / low power states
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
